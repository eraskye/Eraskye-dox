<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CLOVISS SYSTEM PYDXSN</title>
<link rel="stylesheet" href="style.css" />
<style>
  /* ===== КІЛТ ЖАЗБАЙЫНША ҚАЛҒАНЫ КӨРІНБЕЙДІ ===== */
  body.locked #searchPanel,
  body.locked #outputPanel {
    display: none !important;
  }
  body.locked .grid {
    grid-template-columns: 1fr;
    max-width: 560px;
    margin: 40px auto;
  }
  body:not(.locked) #licensePanel {
    display: none;
  }
  body:not(.locked) #btnReset {
    display: inline-flex !important;
  }
  .license-msg {
    margin-top: 12px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .5px;
    min-height: 16px;
  }
  .license-msg.ok { color: var(--accent); }
  .license-msg.err { color: var(--danger); }
</style>
</head>
<body class="locked">
<div class="scanline"></div>

<header class="topbar">
  <div class="brand">
    <span class="glyph">◆</span>
    <h1>CLOVISS SYSTEM <span class="accent">PYDXSN</span></h1>
  </div>
  <div class="status-cluster">
    <span class="pill" id="sysStatus"><span class="dot"></span> ONLINE</span>
    <span class="pill" id="licStatusPill"><span class="dot"></span> NO LICENSE</span>
    <button class="pill link" id="btnReset" style="display:none; cursor:pointer; background:transparent; font-family:var(--mono);">SIGN OUT</button>
    <a class="pill link" href="admin.html">ADMIN</a>
  </div>
</header>

<main class="grid">

  <!-- LICENSE PANEL -->
  <section class="panel" id="licensePanel">
    <h2><span class="num">01</span> LICENSE ACTIVATION</h2>

    <label for="licKey">License Key</label>
    <input id="licKey" type="text" placeholder="CLV-XXXXX-XXXXX-XXXXX-XXXXX" autocomplete="off" spellcheck="false" />

    <div class="btnrow">
      <button id="btnActivate" class="btn primary">ACTIVATE</button>
      <button id="btnClearLic" class="btn ghost">CLEAR</button>
    </div>

    <div class="license-msg" id="licMsg"></div>

    <div class="stats">
      <div class="stat"><span class="k">STATUS</span><span class="v" id="licState">—</span></div>
      <div class="stat"><span class="k">EXPIRES</span><span class="v" id="licExpires">—</span></div>
      <div class="stat"><span class="k">REMAINING</span><span class="v" id="licRemaining">—</span></div>
      <div class="stat"><span class="k">DEVICE</span><span class="v" id="devState">UNBOUND</span></div>
    </div>

    <p class="hint">1 license = 1 device. First activation permanently binds the key.</p>
  </section>

  <!-- SEARCH PANEL -->
  <section class="panel" id="searchPanel">
    <h2><span class="num">02</span> SEARCH</h2>

    <label for="searchType">Search Type</label>
    <select id="searchType">
      <option value="number">NUMBER — phone number lookup</option>
      <option value="vks">VKS — VK lookup</option>
      <option value="sherlock">SHERLOCK — Telegram / username</option>
    </select>

    <label for="query">Query =</label>
    <input id="query" type="text" placeholder="e.g. 77001234567" autocomplete="off" spellcheck="false" />

    <label for="page">Page</label>
    <input id="page" type="number" min="1" value="1" />

    <div class="btnrow">
      <button id="btnSearch" class="btn primary">SEARCH</button>
      <button id="btnClearSearch" class="btn ghost">CLEAR</button>
    </div>

    <div class="btnrow small">
      <button id="btnMe" class="btn ghost wide">ACCOUNT / KEY INFO</button>
    </div>
  </section>

  <!-- OUTPUT PANEL -->
  <section class="panel terminal-panel" id="outputPanel">
    <h2>
      <span class="num">03</span> OUTPUT
      <span class="term-actions">
        <button class="mini" id="btnCopy">COPY</button>
        <button class="mini" id="btnClearOut">CLEAR</button>
      </span>
    </h2>

    <div class="terminal" id="terminal">
      <div class="term-line muted">[cloviss] ready.</div>
    </div>

    <div class="progress" id="progress"><div class="bar"></div></div>
  </section>

</main>

<footer class="foot">
  <span>CLOVISS SYSTEM PYDXSN · v1.0</span>
  <span id="buildInfo">—</span>
</footer>

<script>
(function(){
  const API_BASE_URL = "https://eraskye-dox.onrender.com";
  const LS_KEY  = 'cloviss_active_key';
  const LS_DATA = 'cloviss_lic_data';
  const DEVICE_KEY = 'cloviss_device_id';

  const $ = (id) => document.getElementById(id);

  function getDeviceId() {
    let id = localStorage.getItem(DEVICE_KEY);
    if (!id) {
      id = (crypto.randomUUID && crypto.randomUUID()) ||
           ("dev-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10));
      localStorage.setItem(DEVICE_KEY, id);
    }
    return id;
  }

  function setMsg(text, type){
    const el = $('licMsg');
    if(!el) return;
    el.textContent = text || '';
    el.className = 'license-msg' + (type ? ' ' + type : '');
  }

  function unlock(data){
    document.body.classList.remove('locked');
    const pill = $('licStatusPill');
    if(pill){ pill.className = 'pill ok'; pill.innerHTML = '<span class="dot"></span> LICENSED'; }
    const ls = $('licState'); if(ls){ ls.textContent = 'ACTIVE'; ls.className = 'v ok'; }
    const ds = $('devState'); if(ds){ ds.textContent = 'BOUND';  ds.className = 'v ok'; }
    if(data){
      if(data.expires_at) $('licExpires').textContent = data.expires_at.replace('T',' ').replace('+00:00',' UTC');
      if(typeof data.remaining_seconds === 'number') $('licRemaining').textContent = fmtDur(data.remaining_seconds);
    }
    const btnReset = $('btnReset'); if(btnReset) btnReset.style.display = 'inline-flex';
  }

  function lock(){
    document.body.classList.add('locked');
    const pill = $('licStatusPill');
    if(pill){ pill.className = 'pill err'; pill.innerHTML = '<span class="dot"></span> NO LICENSE'; }
    const btnReset = $('btnReset'); if(btnReset) btnReset.style.display = 'none';
  }

  function isValidFormat(key){
    return /^CLV-[A-Z0-9]{5}-[A-Z0-9]{5}-[A-Z0-9]{5}-[A-Z0-9]{5}$/i.test(key.trim());
  }

  function fmtDur(sec){
    if(sec == null || sec < 0) return '—';
    const d = Math.floor(sec/86400), h = Math.floor((sec%86400)/3600);
    const m = Math.floor((sec%3600)/60), s Math.floor(sec%60);
    if(d>0) return d+'d '+h+'h '+m+'m';
    if(h>0) return h+'h '+m+'m '+s+'s';
    if(m>0) return m+'m '+s+'s';
    return s+'s';
  }

  // ---- Terminal helpers ----
  function term(line, cls){
    const t = $('terminal');
    if(!t) return;
    const d = document.createElement('div');
    d.className = 'term-line' + (cls ? ' ' + cls : '');
    d.textContent = line;
    t.appendChild(d);
    t.scrollTop = t.scrollHeight;
  }

  // ---- Start: check saved license ----
  const saved = localStorage.getItem(LS_KEY);
  if(saved){
    try { unlock(JSON.parse(localStorage.getItem(LS_DATA) || 'null')); } catch(e){ unlock(null); }
    // Optionally re-verify with server
    checkLicense(true);
  } else {
    lock();
  }

  // ---- ACTIVATE ----
  const btnActivate = $('btnActivate');
  if(btnActivate){
    btnActivate.addEventListener('click', async () => {
      const key = ($('licKey').value || '').trim().toUpperCase();
      if(!key){ setMsg('Кілтті енгізіңіз', 'err'); return; }
      if(!isValidFormat(key)){ setMsg('Қате формат. Мысалы: CLV-AAAAA-BBBBB-CCCCC-DDDDD', 'err'); return; }

      setMsg('Тексеру жүріп жатыр...', '');
      btnActivate.disabled = true;

      try {
        const res = await fetch(API_BASE_URL + '/api/license/check', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ key, device_id: getDeviceId() })
        });
        const json = await res.json();
        btnActivate.disabled = false;

        if(res.ok && json.ok){
          localStorage.setItem-check(LS_KEY, key);
          localStorage.setItem(LS_DATA, JSON.stringify(json));
          setMsg('Кілт қабылданды ✓', 'ok');
          setTimeout(() => unlock(json), 400);
        } else {
          setMsg(json.error || json.status || 'Кілт жарамсыз', 'err');
        }
      } catch(e){
        btnActivate.disabled = false;
        setMsg('Желі қатесі: ' + e.message, 'err');
      }
    });
  }

  // ---- Re saved license ----
  async function checkLicense(silent){
    const key = (localStorage.getItem(LS_KEY) || '').trim();
    if(!key) return false;
    try {
      const res = await fetch(API_BASE_URL + '/api/license/check', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ key, device_id: getDeviceId() })
      });
      const json = await res.json();
      if(json.ok){
        localStorage.setItem(LS_DATA, JSON.stringify(json));
        unlock(json);
        return true;
      } else {
        if(!silent) setMsg(json.error || 'Кілт жарамсыз', 'err');
        return false;
      }
    } catch(e){ return false; }
  }

  // ---- CLEAR ----
  const btnClearLic = $('btnClearLic');
  if(btnClearLic){
    btnClearLic.addEventListener('click', () => {
      $('licKey').value = '';
      setMsg('');
    });
  }

  // ---- SIGN OUT ----
  const btnReset = $('btnReset');
  if(btnReset){
    btnReset.addEventListener('click', () => {
      localStorage.removeItem(LS_KEY);
      localStorage.removeItem(LS_DATA);
      location.reload();
    });
  }

  // ---- SEARCH ----
  const btnSearch = $('btnSearch');
  if(btnSearch){
    btnSearch.addEventListener('click', async () => {
      const key = (localStorage.getItem(LS_KEY) || '').trim();
      if(!key){ term('[!] Алдымен кілтті енгізіңіз', 'err'); return; }

      const type = $('searchType').value;
      const q = ($('query').value || '').trim();
      const page = parseInt($('page').value || '1', 10);
      if(!q){ term('[!] Сұраныс енгізіңіз', 'err'); return; }

      term('> ' + type.toUpperCase() + ' :: ' + q, 'info');
      term('[*] Сұраныс жіберілуде...', 'muted');
      btnSearch.disabled = true;

      try {
        const res = await fetch(API_BASE_URL + '/api/search', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ key, device_id: getDeviceId(), type, query: q, page })
        });
        const json = await res.json();
        btnSearch.disabled = false;

        if(res.ok && json.ok){
          term('[+] Нәтиже алынды', 'ok');
          term(typeof json.data === 'string' ? json.data : JSON.stringify(json.data, null, 2));
        } else {
          term('[!] ' + (json.error || ('HTTP ' + res.status)), 'err');
          if(json.detail) term(JSON.stringify(json.detail, null, 2));
        }
      } catch(e){
        btnSearch.disabled = false;
        term('[!] Желі қатесі: ' + e.message, 'err');
      }
    });
  }

  const btnClearSearch = $('btnClearSearch');
  if(btnClearSearch){
    btnClearSearch.addEventListener('click', () => {
      $('query').value = '';
      $('page').value = '1';
    });
  }

  // ---- ACCOUNT / ME ----
  const btnMe = $('btnMe');
  if(btnMe){
    btnMe.addEventListener('click', async () => {
      const key = (localStorage.getItem(LS_KEY) || '').trim();
      if(!key){ term('[!] Алдымен кілтті енгізіңіз', 'err'); return; }
      term('[*] Аккаунт ақпараты сұралуда...', 'muted');
      try {
        const res = await fetch(API_BASE_URL + '/api/account/me', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ key, device_id: getDeviceId() })
        });
        const json = await res.json();
        if(res.ok && json.ok){
          term('[+] Аккаунт:', 'ok');
          term(typeof json.data === 'string' ? json.data : JSON.stringify(json.data, null, 2));
        } else {
          term('[!] ' + (json.error || ('HTTP ' + res.status)), 'err');
        }
      } catch(e){
        term('[!] Желі қатесі: ' + e.message, 'err');
      }
    });
  }

  // ---- Terminal actions ----
  const btnClearOut = $('btnClearOut');
  if(btnClearOut){
    btnClearOut.addEventListener('click', () => {
      const t = $('terminal');
      if(t){ t.innerHTML = '<div class="term-line muted">[cloviss] ready.</div>'; }
    });
  }

  const btnCopy = $('btnCopy');
  if(btnCopy){
    btnCopy.addEventListener('click', () => {
      const t = $('terminal');
      if(!t) return;
      navigator.clipboard.writeText(t.innerText).catch(()=>{});
    });
  }

  // ---- Health check ----
  (async () => {
    try {
      const r = await fetch(API_BASE_URL + '/api/health');
      const h = await r.json();
      const s = $('sysStatus');
      if(s){ s.className = 'pill ok'; s.innerHTML = '<span class="dot"></span> ONLINE'; }
      const bi = $('buildInfo');
      if(bi){ bi.textContent = h.api_configured ? 'API CONFIGURED' : 'API KEY MISSING'; }
    } catch {
      const s = $('sysStatus');
      if(s){ s.className = 'pill err'; s.innerHTML = '<span class="dot"></span> OFFLINE'; }
    }
  })();

})();
</script>
</body>
</html>
